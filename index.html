<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>若函天下无敌</title>
  <style>
    :root {
      --bg-1: #070b1a;
      --bg-2: #151b3b;
      --gold: #ffd76a;
      --pink: #ff78c3;
      --cyan: #70f3ff;
      --white: #f5f8ff;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--white);
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background:
        radial-gradient(1100px 700px at 15% 10%, #2d2f68 0%, transparent 60%),
        radial-gradient(900px 550px at 85% 90%, #2f0f4f 0%, transparent 65%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.9) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 10%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 30% 80%, rgba(255,255,255,.75) 0 1px, transparent 2px),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.65) 0 1px, transparent 2px);
      background-size: 220px 220px;
      animation: drift 90s linear infinite;
      opacity: 0.35;
      pointer-events: none;
    }

    .stars::before {
      transform: scale(1.2);
      animation-duration: 130s;
      opacity: 0.2;
    }

    .stars::after {
      transform: scale(0.85);
      animation-duration: 70s;
      opacity: 0.25;
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(92vw, 920px);
      padding: clamp(2rem, 5vw, 4.2rem);
      border-radius: 32px;
      text-align: center;
      background: linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.26);
      backdrop-filter: blur(14px);
      box-shadow:
        0 25px 70px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,0.35);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      background: radial-gradient(circle, rgba(255,215,106,.45), transparent 65%);
      top: -90px;
      right: -50px;
      filter: blur(1px);
      animation: pulse 6s ease-in-out infinite;
    }

    .headline {
      margin: 0;
      font-size: clamp(2.3rem, 7vw, 6rem);
      letter-spacing: 0.12em;
      font-weight: 800;
      line-height: 1.15;
      background: linear-gradient(90deg, var(--gold), var(--pink), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 10px 35px rgba(0,0,0,.25);
      animation: glow 4.5s ease-in-out infinite;
    }

    .sub {
      margin-top: 1.2rem;
      font-size: clamp(1rem, 2.2vw, 1.35rem);
      color: rgba(245,248,255,0.92);
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .download-btn {
      display: inline-block;
      margin-top: 1.6rem;
      padding: 0.72rem 1.3rem;
      border-radius: 999px;
      text-decoration: none;
      color: #130b24;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: linear-gradient(90deg, var(--gold), #ffe8a8);
      box-shadow: 0 10px 24px rgba(255, 215, 106, 0.35);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 28px rgba(255, 215, 106, 0.5);
      filter: brightness(1.05);
    }

    .ring {
      position: absolute;
      inset: -2px;
      border-radius: 34px;
      border: 2px solid transparent;
      background: linear-gradient(120deg, rgba(255,215,106,.8), rgba(112,243,255,.8), rgba(255,120,195,.8)) border-box;
      -webkit-mask:
        linear-gradient(#000 0 0) padding-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: .7;
      pointer-events: none;
      animation: spin 16s linear infinite;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
      50% { filter: drop-shadow(0 0 18px rgba(255,255,255,0.45)); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: .4; }
      50% { transform: scale(1.08); opacity: .8; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes drift {
      from { transform: translateY(0) translateX(0); }
      to { transform: translateY(-300px) translateX(-180px); }
    }

    @media (max-width: 480px) {
      .sub { letter-spacing: 0.14em; }
      .card { border-radius: 24px; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="card">
    <div class="ring" aria-hidden="true"></div>
    <h1 class="headline">若函天下无敌</h1>
    <p class="sub">Radiant • Fearless • Unstoppable</p>
    <a id="downloadLink" class="download-btn" href="#" download="ruohan.html">下载网页文件</a>
  </main>
  <script>
    const downloadLink = document.getElementById("downloadLink");
    const htmlContent = "<!doctype html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    downloadLink.href = url;

    window.addEventListener("beforeunload", () => {
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
